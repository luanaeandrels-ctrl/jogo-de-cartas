<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo de Cartas - Palco da Live</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121218;
            background-image: linear-gradient(rgba(12, 12, 20, 0.72), rgba(12, 12, 20, 0.84)), url('fundo.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #f0f0f5;
            padding: 15px;
            min-height: 100vh;
        }

        header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            background-color: rgba(26, 26, 38, 0.92);
            padding: 14px 18px;
            border-radius: 12px;
            margin-bottom: 16px;
            border: 1px solid #383854;
        }

        header h1 {
            font-size: 1.25rem;
            color: #ffcc00;
        }

        .controles-topo {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
        }

        .label-inline {
            font-size: 0.9rem;
            color: #d6d6ec;
        }

        .controles-topo select,
        .controles-topo input[type="number"] {
            padding: 8px 10px;
            border-radius: 6px;
            border: 1px solid #555577;
            background-color: #26263a;
            color: white;
            font-weight: bold;
        }

        .controles-topo input[type="number"] {
            width: 68px;
        }

        button {
            padding: 9px 14px;
            border: none;
            border-radius: 7px;
            font-weight: bold;
            cursor: pointer;
            color: white;
            background-color: #6c5ce7;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        button:hover {
            background-color: #5649c0;
        }

        button:active {
            transform: scale(0.98);
        }

        .container-principal {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 18px;
            align-items: start;
        }

        .painel-controle {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .box-comando,
        .box-dado,
        .box-log {
            background-color: rgba(26, 26, 38, 0.92);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #383854;
        }

        h2 {
            font-size: 1rem;
            margin-bottom: 10px;
            color: #a29bfe;
        }

        .campo-cola-codigo {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .campo-cola-codigo input {
            width: 100%;
            padding: 11px 12px;
            border-radius: 8px;
            border: 2px solid #6c5ce7;
            background-color: #12121a;
            color: #ffcc00;
            font-size: 1rem;
            font-weight: bold;
        }

        .dica-comando {
            font-size: 0.78rem;
            color: #b8b8d4;
            line-height: 1.35;
        }

        .btn-confirmar {
            background-color: #00b894;
            width: 100%;
        }

        .btn-confirmar:hover {
            background-color: #00997a;
        }

        .dado-display {
            font-size: 2.5rem;
            font-weight: bold;
            text-align: center;
            background: #12121a;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
            color: #00cec9;
            border: 2px dashed #00cec9;
        }

        .box-dado button {
            width: 100%;
            background-color: #0984e3;
        }

        .box-dado button:hover {
            background-color: #076bb8;
        }

        .box-log {
            max-height: 240px;
            overflow-y: auto;
        }

        #lista-log {
            list-style: none;
            font-size: 0.84rem;
        }

        #lista-log li {
            padding: 6px 0;
            border-bottom: 1px solid #2b2b3d;
        }

        .mesa-cartas {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 14px;
            background-color: rgba(18, 18, 28, 0.52);
            padding: 14px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .carta-container {
            perspective: 1000px;
            aspect-ratio: 9 / 16;
            cursor: pointer;
        }

        .carta-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.55s;
            transform-style: preserve-3d;
        }

        .carta-container.virada .carta-inner {
            transform: rotateY(180deg);
        }

        .carta-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 12px;
            overflow: hidden;
            border: 3px solid #3d3d5c;
            background-color: #181824;
        }

        .carta-frente {
            transform: rotateY(180deg);
            display: flex;
            flex-direction: column;
        }

        .carta-verso img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .carta-frente img {
            width: 100%;
            flex: 1;
            min-height: 0;
            object-fit: cover;
            object-position: top center;
            display: block;
        }

        .numero-carta {
            position: absolute;
            top: 8px;
            left: 8px;
            z-index: 2;
            background-color: rgba(0, 0, 0, 0.85);
            color: #ffcc00;
            font-weight: bold;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.9rem;
        }

        .badge-papel {
            position: absolute;
            top: 8px;
            right: 8px;
            z-index: 2;
            background-color: #d63031;
            color: white;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: bold;
            display: none;
        }

        .carta-container.revelar .badge-papel {
            display: block;
        }

        .info-carta {
            padding: 6px;
            font-size: 0.76rem;
            background-color: #1e1e2a;
            text-align: center;
        }

        .carta-container.eliminada .carta-face {
            opacity: 0.4;
            filter: grayscale(100%);
            border-color: #d63031;
        }

        .carta-container.protegida .carta-face {
            border-color: #00cec9;
            box-shadow: 0 0 12px rgba(0, 206, 201, 0.7);
        }

        .palco-overlay {
            position: fixed;
            inset: 0;
            background: rgba(8, 8, 14, 0.9);
            backdrop-filter: blur(5px);
            display: none;
            justify-content: center;
            align-items: center;
            padding: 16px;
            overflow-y: auto;
            z-index: 999;
        }

        .palco-overlay.ativo {
            display: flex;
        }

        .palco-card {
            width: 100%;
            max-width: 780px;
            background: #1b1b28;
            border: 2px solid #57577a;
            border-radius: 18px;
            padding: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.75);
        }

        .palco-topo-wrap {
            text-align: center;
        }

        .palco-comando-topo {
            display: inline-block;
            background: #ffffff;
            color: #111118;
            font-size: 1.4rem;
            font-weight: 900;
            padding: 7px 22px;
            border-radius: 12px;
            border: 3px solid #111118;
            margin-bottom: 16px;
        }

        .palco-grade-dupla {
            display: grid;
            grid-template-columns: repeat(2, minmax(210px, 270px));
            justify-content: center;
            gap: 20px;
        }

        .quadro-palco {
            position: relative;
            aspect-ratio: 9 / 16;
            width: 100%;
            background: #12121b;
            border-radius: 14px;
            overflow: hidden;
            border: 2px solid #3c3c59;
        }

        .quadro-palco img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: top center;
            display: block;
        }

        .legenda-fala {
            position: absolute;
            left: 10px;
            right: 10px;
            bottom: 12px;
            background: #2f54eb;
            color: #ffffff;
            padding: 9px 12px;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 700;
            text-align: center;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.55);
        }

        .etiqueta-bias {
            position: absolute;
            left: 12px;
            bottom: 12px;
            background: #4b49d8;
            color: #ffffff;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.92rem;
            font-weight: 700;
        }

        .palco-rodape {
            margin-top: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .status-retorno {
            font-size: 0.9rem;
            color: #ffd166;
            font-weight: 600;
        }

        .btn-fechar-palco {
            background-color: #00b894;
            padding: 11px 22px;
            font-size: 1rem;
        }

        .btn-fechar-palco:hover {
            background-color: #00997a;
        }

        @media (max-width: 820px) {
            .container-principal {
                grid-template-columns: 1fr;
            }
            .mesa-cartas {
                grid-template-columns: repeat(2, 1fr);
            }
            .palco-grade-dupla {
                grid-template-columns: repeat(2, minmax(130px, 1fr));
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>🃏 MESA DE INVESTIGAÇÃO</h1>
        <div class="controles-topo">
            <label for="pacote-fotos" class="label-inline">Grupo:</label>
            <select id="pacote-fotos" onchange="iniciarJogo()">
                <option value="atores-asiaticos">Atores Asiáticos</option>
                <option value="atrizes-asiaticas">Atrizes Asiáticas</option>
                <option value="atores-ocidentais">Atores Ocidentais</option>
                <option value="atrizes-ocidentais">Atrizes Ocidentais</option>
            </select>

            <label for="qtd-cartas" class="label-inline">Cartas:</label>
            <input type="number" id="qtd-cartas" min="4" max="20" value="20" onchange="iniciarJogo()">

            <button onclick="iniciarJogo()">🎲 Sortear Cartas e Papéis</button>
            <button onclick="recomecarComSobreviventes()">🔄 Novo Sorteio (Sobreviventes)</button>
            <button onclick="toggleRevelarPapeis()">👁️ Ver / Esconder Papéis</button>
        </div>
    </header>

    <main class="container-principal">
        <aside class="painel-controle">
            <div class="box-comando">
                <h2>📋 Colar Código da Live</h2>
                <div class="campo-cola-codigo">
                    <input
                        type="text"
                        id="input-comando-live"
                        placeholder="Ex: 8>16 defesa"
                        onkeydown="if(event.key === 'Enter') processarComandoLive()"
                    >
                    <div class="dica-comando">
                        Cole do chat neste formato: <strong>8&gt;16 defesa</strong>, <strong>8&gt;14 ataque</strong> ou <strong>8&gt;10 denuncia</strong>.
                    </div>
                    <button class="btn-confirmar" onclick="processarComandoLive()">⚡ Mostrar na Tela</button>
                </div>
            </div>

            <div class="box-dado">
                <h2>🎲 Dado</h2>
                <div id="resultado-dado" class="dado-display">-</div>
                <button onclick="rolarDado()">Rolar Dado (1 a 20)</button>
            </div>

            <div class="box-log">
                <h2>📜 Histórico</h2>
                <ul id="lista-log"></ul>
            </div>
        </aside>

        <section class="mesa-cartas" id="mesa-cartas"></section>
    </main>

    <div id="palco-overlay" class="palco-overlay">
        <div class="palco-card">
            <div class="palco-topo-wrap">
                <div id="palco-comando-texto" class="palco-comando-topo">8&gt;16 defesa</div>
            </div>

            <div class="palco-grade-dupla">
                <div class="quadro-palco">
                    <img id="palco-img-acao" src="defesa.png" alt="Cartinha de ação" onerror="tratarErroAcao(this)">
                    <div id="palco-fala-acao" class="legenda-fala">O número 16 está sob minha proteção</div>
                </div>

                <div class="quadro-palco">
                    <img id="palco-img-bias" src="" alt="Carta do bias" onerror="tratarErroFotoBias(this, 1)">
                    <div id="palco-nome-bias" class="etiqueta-bias">Carta #16</div>
                </div>
            </div>

            <div class="palco-rodape">
                <span id="palco-status-retorno" class="status-retorno"></span>
                <button class="btn-fechar-palco" onclick="fecharPalco()">Voltar para a Mesa</button>
            </div>
        </div>
    </div>

    <script>
        const FUNDOS_VERSO = [
            'verso1.png',
            'verso2.png',
            'verso3.png',
            'verso4.png'
        ];

        const IMAGENS_ACAO = {
            ataque: 'ataque.png',
            ataqueFalhou: 'ataque-falhou.png',
            biasSequestrado: 'bias-sequestrado.png',
            defesa: 'defesa.png',
            denuncia: 'denuncia.png',
            denunciaCerta: 'denuncia-certa.png',
            investigacao: 'investigacao.png'
        };

        const PACOTES = {
            'atores-asiaticos': {
                pasta: 'atores-asiaticos/',
                sufixo: ').jpg',
                totalDisponivel: 37
            },
            'atrizes-asiaticas': {
                pasta: 'atrizes-asiaticas/',
                sufixo: ').jpg',
                totalDisponivel: 20
            },
            'atores-ocidentais': {
                pasta: 'atores-ocidentais/',
                sufixo: ').jpg',
                totalDisponivel: 20
            },
            'atrizes-ocidentais': {
                pasta: 'atrizes-ocidentais/',
                sufixo: ').jpg',
                totalDisponivel: 20
            }
        };

        let jogadores = [];
        let modoMestre = false;
        let rodadaAtual = 1;
        let jogadaPendenteMesa = null;

        function obterQuantidadeCartas() {
            const input = document.getElementById('qtd-cartas');
            let valor = parseInt(input ? input.value : '20', 10);
            if (Number.isNaN(valor)) valor = 20;
            valor = Math.max(4, Math.min(20, valor));
            if (input) input.value = valor;
            return valor;
        }

        function formatarDoisDigitos(num) {
            return String(num).padStart(2, '0');
        }

        // Tenta primeiro "img (02).jpg" e, se falhar, tenta "IMG (02).jpg"
        function montarCaminhoFoto(pacote, indiceFoto, maiusculo = false) {
            const prefixo = maiusculo ? 'IMG (' : 'img (';
            return `${pacote.pasta}${prefixo}${formatarDoisDigitos(indiceFoto)}${pacote.sufixo}`;
        }

        function escolherFundoAleatorio() {
            const indice = Math.floor(Math.random() * FUNDOS_VERSO.length);
            return FUNDOS_VERSO[indice];
        }

        function sortearIndicesFotos(totalDisponivel, quantidade) {
            const limite = Math.max(1, totalDisponivel);
            const pool = [];
            for (let i = 1; i <= limite; i++) {
                pool.push(i);
            }
            pool.sort(() => Math.random() - 0.5);

            const escolhidos = [];
            for (let i = 0; i < quantidade; i++) {
                escolhidos.push(pool[i % pool.length]);
            }
            return escolhidos;
        }

        function criarBaralhoInicial() {
            const chave = document.getElementById('pacote-fotos')?.value || 'atores-asiaticos';
            const pacote = PACOTES[chave] || PACOTES['atores-asiaticos'];
            const quantidadeCartas = obterQuantidadeCartas();
            const indicesSorteados = sortearIndicesFotos(pacote.totalDisponivel, quantidadeCartas);

            jogadores = [];
            for (let i = 1; i <= quantidadeCartas; i++) {
                const fotoNum = indicesSorteados[i - 1];
                jogadores.push({
                    numero: i,
                    fotoNum,
                    pacote,
                    fotoFrente: montarCaminhoFoto(pacote, fotoNum, false),
                    fotoVerso: escolherFundoAleatorio(),
                    virada: false,
                    papel: 'Vítima 👸🏽',
                    vivo: true,
                    ultimaAcao: null,
                    protegido: false
                });
            }
        }

        function sortearPapeis() {
            const vivos = jogadores.filter(j => j.vivo);
            vivos.forEach(j => {
                j.papel = 'Vítima 👸🏽';
                j.protegido = false;
            });

            const indices = vivos.map((_, idx) => idx);
            indices.sort(() => Math.random() - 0.5);

            if (indices.length >= 2) {
                vivos[indices[0]].papel = 'Ladrão 🦹🏽‍♀️';
                vivos[indices[1]].papel = 'Policial 👮🏽‍♀️';
            }

            adicionarLog(`🎲 ${jogadores.length} cartas | Papéis sorteados entre ${vivos.length} ativos.`);
        }

        function iniciarJogo() {
            jogadaPendenteMesa = null;
            fecharPalco(false);
            criarBaralhoInicial();
            sortearPapeis();
            rodadaAtual = 1;
            renderizarMesa();
        }

        function recomecarComSobreviventes() {
            const vivos = jogadores.filter(j => j.vivo);
            if (vivos.length <= 3) {
                alert('Fim de jogo! Restam 3 ou menos participantes na mesa.');
                return;
            }

            jogadaPendenteMesa = null;
            fecharPalco(false);

            vivos.forEach(j => {
                j.fotoVerso = escolherFundoAleatorio();
                j.virada = false;
            });

            sortearPapeis();
            rodadaAtual++;
            renderizarMesa();
        }

        function alternarVirarCarta(numero) {
            const jogador = jogadores.find(j => j.numero === numero);
            if (!jogador) return;
            jogador.virada = !jogador.virada;
            renderizarMesa();
        }

        function rolarDado() {
            const display = document.getElementById('resultado-dado');
            let giros = 0;
            const intervalo = setInterval(() => {
                display.innerText = Math.floor(Math.random() * 20) + 1;
                giros++;
                if (giros > 10) {
                    clearInterval(intervalo);
                    const numeroFinal = Math.floor(Math.random() * 20) + 1;
                    display.innerText = numeroFinal;
                    adicionarLog(`🎲 Dado: ${numeroFinal}`);
                }
            }, 50);
        }

        function normalizarAcao(textoAcao) {
            const limpo = textoAcao
                .toLowerCase()
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')
                .trim();

            if (limpo.startsWith('defes') || limpo.startsWith('proteg')) return 'defesa';
            if (limpo.startsWith('ataqu')) return 'ataque';
            if (limpo.startsWith('denunc') || limpo.startsWith('investig')) return 'denuncia';
            return null;
        }

        function interpretarComando(textoBruto) {
            const match = textoBruto.trim().match(/^(\d+)\s*(?:>|->|-)\s*(\d+)\s+(.+)$/);
            if (!match) return null;

            const origem = parseInt(match[1], 10);
            const alvo = parseInt(match[2], 10);
            const acao = normalizarAcao(match[3]);

            if (!acao || Number.isNaN(origem) || Number.isNaN(alvo)) return null;
            return { origem, alvo, acao, original: textoBruto.trim() };
        }

        function processarComandoLive() {
            const input = document.getElementById('input-comando-live');
            const texto = input ? input.value : '';
            const parsed = interpretarComando(texto);

            if (!parsed) {
                alert('Use o formato: 8>16 defesa, 8>14 ataque ou 8>10 denuncia');
                return;
            }

            const ator = jogadores.find(j => j.numero === parsed.origem && j.vivo);
            const alvo = jogadores.find(j => j.numero === parsed.alvo && j.vivo);

            if (!ator || !alvo) {
                alert('Número inválido ou participante já eliminado.');
                return;
            }

            if (ator.ultimaAcao === parsed.acao) {
                alert(`O nº ${ator.numero} não pode repetir "${parsed.acao.toUpperCase()}" em rodadas seguidas.`);
                return;
            }

            ator.ultimaAcao = parsed.acao;

            let imagemAcao = IMAGENS_ACAO.defesa;
            let falaAcao = `O número ${alvo.numero} está sob minha proteção`;
            let statusRetorno = `Ao voltar para a mesa, a carta #${alvo.numero} ficará VIRADA PARA BAIXO (protegida).`;

            jogadaPendenteMesa = {
                tipo: 'manter_baixo',
                alvoNumero: alvo.numero
            };

            if (parsed.acao === 'defesa') {
                alvo.protegido = true;
                imagemAcao = IMAGENS_ACAO.defesa;
                falaAcao = `O número ${alvo.numero} está sob minha proteção`;
                statusRetorno = `Ao voltar para a mesa, a carta #${alvo.numero} volta VIRADA PARA BAIXO sob defesa.`;
                adicionarLog(`👮🏽‍♀️ [${parsed.original}] Nº ${ator.numero} defendeu o nº ${alvo.numero}.`);
            } else if (parsed.acao === 'ataque') {
                if (ator.papel !== 'Ladrão 🦹🏽‍♀️') {
                    imagemAcao = IMAGENS_ACAO.ataque;
                    falaAcao = `O número ${alvo.numero} sofreu ataque (sem eliminação do Ladrão)`;
                    statusRetorno = `Ao voltar para a mesa, a carta #${alvo.numero} continua VIRADA PARA BAIXO.`;
                    adicionarLog(`⚔️ [${parsed.original}] Nº ${ator.numero} atacou o nº ${alvo.numero}.`);
                } else if (alvo.papel === 'Policial 👮🏽‍♀️') {
                    imagemAcao = IMAGENS_ACAO.ataqueFalhou;
                    falaAcao = `O número ${alvo.numero} é o Policial e o ataque falhou!`;
                    statusRetorno = `Ao voltar para a mesa, a carta #${alvo.numero} volta VIRADA PARA BAIXO.`;
                    adicionarLog(`🛡️ [${parsed.original}] Ladrão (#${ator.numero}) atacou o Policial (#${alvo.numero}) e falhou.`);
                } else if (alvo.protegido) {
                    imagemAcao = IMAGENS_ACAO.ataqueFalhou;
                    falaAcao = `O número ${alvo.numero} estava protegido! Ladrão #${ator.numero} foi pego!`;
                    statusRetorno = `Ao voltar para a mesa, a carta #${alvo.numero} volta VIRADA PARA BAIXO e o Ladrão #${ator.numero} fica VIRADO PARA CIMA (eliminado).`;
                    jogadaPendenteMesa = {
                        tipo: 'eliminar',
                        alvoNumero: ator.numero,
                        manterAlvoBaixo: alvo.numero
                    };
                    adicionarLog(`🚨 [${parsed.original}] Ladrão (#${ator.numero}) atacou #${alvo.numero} protegido e foi preso!`);
                } else {
                    imagemAcao = IMAGENS_ACAO.biasSequestrado;
                    falaAcao = `O número ${alvo.numero} não tinha defesa e foi eliminado!`;
                    statusRetorno = `Ao voltar para a mesa, a carta #${alvo.numero} ficará VIRADA PARA CIMA (eliminada).`;
                    jogadaPendenteMesa = {
                        tipo: 'eliminar',
                        alvoNumero: alvo.numero
                    };
                    adicionarLog(`💀 [${parsed.original}] Ataque eliminou o nº ${alvo.numero}.`);
                }
            } else if (parsed.acao === 'denuncia') {
                if (alvo.papel === 'Ladrão 🦹🏽‍♀️') {
                    imagemAcao = IMAGENS_ACAO.denunciaCerta;
                    falaAcao = `Denúncia certa! O número ${alvo.numero} era o Ladrão!`;
                    statusRetorno = `Ao voltar para a mesa, a carta #${alvo.numero} ficará VIRADA PARA CIMA (eliminada).`;
                    jogadaPendenteMesa = {
                        tipo: 'eliminar',
                        alvoNumero: alvo.numero,
                        denunciante: ator
                    };
                    adicionarLog(`🎉 [${parsed.original}] Nº ${ator.numero} acertou a denúncia no nº ${alvo.numero}!`);
                } else {
                    imagemAcao = IMAGENS_ACAO.denuncia;
                    falaAcao = `Denúncia no número ${alvo.numero}: não era o Ladrão!`;
                    statusRetorno = `Ao voltar para a mesa, a carta #${alvo.numero} continua VIRADA PARA BAIXO.`;
                    adicionarLog(`👸🏽 [${parsed.original}] Nº ${ator.numero} denunciou o nº ${alvo.numero} (incorreto).`);
                }
            }

            abrirPalco({
                comando: parsed.original,
                imagemAcao,
                falaAcao,
                alvo,
                statusRetorno
            });

            if (input) input.value = '';
        }

        function abrirPalco({ comando, imagemAcao, falaAcao, alvo, statusRetorno }) {
            const overlay = document.getElementById('palco-overlay');
            const cmdEl = document.getElementById('palco-comando-texto');
            const imgAcaoEl = document.getElementById('palco-img-acao');
            const falaEl = document.getElementById('palco-fala-acao');
            const imgBiasEl = document.getElementById('palco-img-bias');
            const nomeBiasEl = document.getElementById('palco-nome-bias');
            const statusEl = document.getElementById('palco-status-retorno');

            cmdEl.innerText = comando;
            imgAcaoEl.dataset.fallbackAplicado = 'false';
            imgAcaoEl.src = imagemAcao;
            falaEl.innerText = falaAcao;

            imgBiasEl.dataset.tentouMaiusculo = 'false';
            imgBiasEl.dataset.fallbackAplicado = 'false';
            imgBiasEl.dataset.fotoNum = String(alvo.fotoNum);
            imgBiasEl.dataset.pasta = alvo.pacote.pasta;
            imgBiasEl.dataset.sufixo = alvo.pacote.sufixo;
            imgBiasEl.dataset.numeroCarta = String(alvo.numero);
            imgBiasEl.src = alvo.fotoFrente;
            nomeBiasEl.innerText = `Carta #${alvo.numero} • Foto ${alvo.fotoNum}`;
            statusEl.innerText = statusRetorno;

            overlay.classList.add('ativo');
        }

        function fecharPalco(aplicarEstadoMesa = true) {
            const overlay = document.getElementById('palco-overlay');
            overlay.classList.remove('ativo');

            if (aplicarEstadoMesa && jogadaPendenteMesa) {
                if (jogadaPendenteMesa.manterAlvoBaixo) {
                    const protegidoCarta = jogadores.find(j => j.numero === jogadaPendenteMesa.manterAlvoBaixo);
                    if (protegidoCarta && protegidoCarta.vivo) {
                        protegidoCarta.virada = false;
                    }
                }

                if (jogadaPendenteMesa.tipo === 'manter_baixo') {
                    const cartaAlvo = jogadores.find(j => j.numero === jogadaPendenteMesa.alvoNumero);
                    if (cartaAlvo && cartaAlvo.vivo) {
                        cartaAlvo.virada = false;
                    }
                } else if (jogadaPendenteMesa.tipo === 'eliminar') {
                    eliminarJogador(jogadaPendenteMesa.alvoNumero);
                    if (jogadaPendenteMesa.denunciante) {
                        verificarFaseFinal(jogadaPendenteMesa.denunciante);
                    }
                }

                jogadaPendenteMesa = null;
                renderizarMesa();
            }
        }

        function eliminarJogador(numero) {
            const jogador = jogadores.find(j => j.numero === numero);
            if (jogador) {
                jogador.vivo = false;
                jogador.virada = true;
            }

            const vivos = jogadores.filter(j => j.vivo);
            if (vivos.length <= 3) {
                adicionarLog(`🏆 Fim de jogo! Sobraram: ${vivos.map(v => '#' + v.numero).join(', ')}`);
            }
        }

        function verificarFaseFinal(denunciante) {
            const vivos = jogadores.filter(j => j.vivo);
            if (vivos.length === 4) {
                const policial = vivos.find(j => j.papel === 'Policial 👮🏽‍♀️');
                const sobrevivente = vivos.find(j => j.papel === 'Vítima 👸🏽' && j.numero !== denunciante.numero);
                adicionarLog(
                    `🏅 Pontuação (4 cartas): 1º Policial (#${policial ? policial.numero : '-'}) | 2º Denunciante (#${denunciante.numero}) | 3º Sobrevivente (#${sobrevivente ? sobrevivente.numero : '-'})`
                );
            }
        }

        function toggleRevelarPapeis() {
            modoMestre = !modoMestre;
            renderizarMesa();
        }

        function adicionarLog(mensagem) {
            const ul = document.getElementById('lista-log');
            const li = document.createElement('li');
            li.innerText = mensagem;
            ul.prepend(li);
        }

        function tratarErroAcao(imgElement) {
            if (imgElement.dataset.fallbackAplicado === 'true') return;
            imgElement.dataset.fallbackAplicado = 'true';
            imgElement.src = `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(
                `<svg xmlns="http://www.w3.org/2000/svg" width="270" height="480"><rect width="100%" height="100%" fill="#1e1e2e"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="#a29bfe" font-family="sans-serif" font-size="16">Cartinha de Ação</text></svg>`
            )}`;
        }

        function tratarErroFotoBias(imgElement, numeroCartaFallback = 1) {
            const fotoNum = parseInt(imgElement.dataset.fotoNum || '1', 10);
            const pasta = imgElement.dataset.pasta || 'atores-asiaticos/';
            const sufixo = imgElement.dataset.sufixo || ').jpg';
            const numeroCarta = imgElement.dataset.numeroCarta || numeroCartaFallback;

            if (imgElement.dataset.tentouMaiusculo !== 'true') {
                imgElement.dataset.tentouMaiusculo = 'true';
                imgElement.src = `${pasta}IMG (${formatarDoisDigitos(fotoNum)}${sufixo}`;
                return;
            }

            if (imgElement.dataset.fallbackAplicado === 'true') return;
            imgElement.dataset.fallbackAplicado = 'true';
            imgElement.src = `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(
                `<svg xmlns="http://www.w3.org/2000/svg" width="270" height="480"><rect width="100%" height="100%" fill="#28283d"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="#ffcc00" font-family="sans-serif" font-size="18">Carta #${numeroCarta}</text></svg>`
            )}`;
        }

        function renderizarMesa() {
            const mesa = document.getElementById('mesa-cartas');
            mesa.innerHTML = '';

            jogadores.forEach(jogador => {
                const div = document.createElement('div');
                div.className = [
                    'carta-container',
                    jogador.virada ? 'virada' : '',
                    !jogador.vivo ? 'eliminada' : '',
                    jogador.protegido ? 'protegida' : '',
                    modoMestre ? 'revelar' : ''
                ].filter(Boolean).join(' ');

                div.onclick = () => alternarVirarCarta(jogador.numero);

                div.innerHTML = `
                    <span class="numero-carta">#${jogador.numero}</span>
                    <span class="badge-papel">${jogador.papel}</span>
                    <div class="carta-inner">
                        <div class="carta-face carta-verso">
                            <img src="${jogador.fotoVerso}" alt="Verso da carta ${jogador.numero}" onerror="tratarErroFotoBias(this, ${jogador.numero})">
                        </div>
                        <div class="carta-face carta-frente">
                            <img
                                src="${jogador.fotoFrente}"
                                alt="Foto ${jogador.fotoNum}"
                                data-foto-num="${jogador.fotoNum}"
                                data-pasta="${jogador.pacote.pasta}"
                                data-sufixo="${jogador.pacote.sufixo}"
                                data-numero-carta="${jogador.numero}"
                                onerror="tratarErroFotoBias(this, ${jogador.numero})"
                            >
                            <div class="info-carta">
                                <strong>${jogador.vivo ? '🟢 Em jogo' : '🔴 Eliminado'}</strong><br>
                                <small>${jogador.protegido ? '🛡️ Protegido' : 'Última: ' + (jogador.ultimaAcao ? jogador.ultimaAcao.toUpperCase() : 'Nenhuma')}</small>
                            </div>
                        </div>
                    </div>
                `;

                mesa.appendChild(div);
            });
        }

        iniciarJogo();
    </script>
</body>
</html>
